<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kitty每日英语小课堂</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    kittyPink: '#FFC0CB',
                    kittyDeepPink: '#FF8DA1',
                    kittyLight: '#FFF0F5',
                },
                fontFamily: {
                    cute: ['"Microsoft YaHei"', 'sans-serif'],
                }
            }
        }
    }
</script>
<style>
    body {
        background-color: #FFF8FB;
        background-image:
            radial-gradient(circle at 20% 20%, #FFE4F1 0 8%, transparent 9%),
            radial-gradient(circle at 80% 10%, #FFD6E7 0 6%, transparent 7%),
            radial-gradient(circle at 40% 80%, #FFE1F0 0 7%, transparent 8%),
            radial-gradient(circle at 70% 70%, #FFD1E6 0 5%, transparent 6%);
    }
    .kitty-card {
        transition: all 0.25s ease;
    }
    .kitty-card:active {
        transform: scale(0.96);
    }
    .bounce-in {
        animation: bounceIn 0.4s ease;
    }
    @keyframes bounceIn {
        0% { transform: scale(0.7); opacity: 0; }
        60% { transform: scale(1.06); opacity: 1; }
        100% { transform: scale(1); }
    }
    .heart-float {
        position: fixed;
        font-size: 24px;
        pointer-events: none;
        animation: floatUp 1.2s ease-out forwards;
        z-index: 50;
    }
    @keyframes floatUp {
        0% { transform: translateY(0) scale(0.8); opacity: 1; }
        100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
    }
    /* 喇叭按钮样式 */
    .speak-btn {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: #FF8DA1;
        color: white;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        transition: 0.2s;
        user-select: none;
    }
    .speak-btn:hover {
        background: #ff6b8b;
        scale: 1.08;
    }
    .speak-btn:active {
        scale: 0.92;
    }
    .speak-btn.loading {
        background: #ccc;
        pointer-events: none;
    }
    /* 底部轻提示（替代吓人的alert弹窗） */
    #kittyToast {
        position: fixed;
        left: 50%;
        bottom: 18%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 10px 20px;
        border-radius: 999px;
        font-size: 14px;
        z-index: 99;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        max-width: 80%;
        text-align: center;
    }
</style>
</head>
<body class="min-h-screen font-cute py-6 px-4">
    <div class="max-w-md mx-auto">
        <!-- 头部：Hello Kitty图片 -->
        <div class="text-center mb-6">
            <img
                src="https://ts1.tc.mm.bing.net/th/id/R-C.46bca01b5ef850d6ba573e7ca56e3bb7?rik=AnfTyID1E0AtRQ&riu=http%3a%2f%2fn.sinaimg.cn%2fsinakd20121%2f762%2fw1000h562%2f20241102%2f8584-baede10b510bf642f978d08cb29834b5.jpg&ehk=3eryNKgttcEdutMkpmFUrAQZWm5EPokdlJBRoRSJvfU%3d&risl=&pid=ImgRaw&r=0"
                alt="Kitty"
                class="w-48 mx-auto rounded-3xl shadow-md shadow-pink-200 border-4 border-kittyPink"
            />
            <h1 class="text-3xl text-kittyDeepPink font-bold mt-4">🎀 Kitty每日英语小课堂 🎀</h1>
            <p class="text-gray-500 mt-2 text-sm">每天5句口语，一点点变厉害～</p>
        </div>
        <!-- 进度提示 -->
        <div class="bg-white rounded-full shadow-sm border-2 border-kittyPink px-4 py-2 mb-5 flex justify-between items-center">
            <span class="text-kittyDeepPink text-sm font-bold">学习进度</span>
            <span id="progressText" class="text-kittyDeepPink text-sm font-bold">1 / 5</span>
        </div>
        <!-- 句子学习区 -->
        <div class="space-y-4" id="lessonArea">
            <div id="cardContainer"></div>
            <!-- 点击解锁按钮 -->
            <button
                id="nextBtn"
                class="w-full bg-kittyDeepPink hover:bg-pink-500 active:bg-pink-600 text-white font-bold py-4 rounded-full shadow-lg shadow-pink-300 text-lg mt-4"
            >
                我学会啦，下一句 ✨
            </button>
        </div>
        <!-- 底部鼓励语 -->
        <div class="text-center mt-8 text-gray-400 text-sm">
            <p>💕 给丹丹的每日英语小练习 💕</p>
        </div>
    </div>
    <!-- 完成弹窗 -->
    <div id="finishModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 mx-6 text-center shadow-2xl border-4 border-kittyPink bounce-in">
            <img
                src="https://ts1.tc.mm.bing.net/th/id/R-C.46bca01b5ef850d6ba573e7ca56e3bb7?rik=AnfTyID1E0AtRQ&riu=http%3a%2f%2fn.sinaimg.cn%2fsinakd20121%2f762%2fw1000h562%2f20241102%2f8584-baede10b510bf642f978d08cb29834b5.jpg&ehk=3eryNKgttcEdutMkpmFUrAQZWm5EPokdlJBRoRSJvfU%3d&risl=&pid=ImgRaw&r=0"
                alt="Kitty"
                class="w-32 mx-auto rounded-2xl border-4 border-kittyPink"
            />
            <h2 class="text-2xl text-kittyDeepPink font-bold mt-4">太棒了丹丹！</h2>
            <p id="randomEncourageText" class="text-gray-600 mt-2"></p>
            <button
                id="restartBtn"
                class="mt-5 bg-kittyDeepPink text-white font-bold px-6 py-3 rounded-full shadow-md"
            >
                再学一次
            </button>
        </div>
    </div>
    <!-- 底部轻提示 -->
    <div id="kittyToast"></div>
<script>
// ===================== 【每天在这里修改5句英语！】=====================
const dailySentences = [
    { en: "Are you kidding me?", zh: "你在开玩笑吧？" },
    { en: "I hope so.", zh: "我希望如此" },
    { en: "What's wrong with you?", zh: "你有毛病吧？" },
    { en: "Trust me.", zh: "相信我" },
    { en: "I see.", zh: "我明白了" }
];
const encourageList = [
    "坚持每天学习，英语会越来越厉害🎀",
    "丹丹超棒，日积月累就会有很大进步✨",
    "小猫为你鼓掌，继续加油哦💖",
    "小小的积累，会带来大大的收获！",
    "今日任务完成，给自己点个赞👍",
    "Kitty看到你的努力啦，再接再厉！",
    "每天进步一点点，未来闪闪发光🌟"
];
// =====================================================================
const cardContainer = document.getElementById('cardContainer');
const progressText = document.getElementById('progressText');
const nextBtn = document.getElementById('nextBtn');
const finishModal = document.getElementById('finishModal');
const restartBtn = document.getElementById('restartBtn');
const randomEncourageText = document.getElementById('randomEncourageText');
let currentStep = 1;
let cardDomList = [];

// ===================== 语音朗读：多重保险方案 =====================
// 依次尝试：有道TTS(国内直连) → 谷歌备用域名 → 谷歌官方(需科学上网)
// 全部失败时，最后用手机自带的离线语音合成，基本保证任何手机都能读
const TTS_URL_MAKERS = [
    t => `https://dict.youdao.com/dictvoice?type=2&audio=${encodeURIComponent(t)}`,
    t => `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(t)}`,
    t => `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(t)}`
];
let currentAudio = null;

// 提前加载手机里的语音包列表（安卓需要触发一次才有数据）
if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function stopAllAudio() {
    if (currentAudio) {
        try { currentAudio.pause(); } catch (e) {}
        currentAudio.onerror = null;
        currentAudio.onended = null;
        currentAudio = null;
    }
    if (window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
    }
}

// 规范句子：去掉多余空格、把中文标点换成英文标点，让TTS读得更准
function cleanSentence(text) {
    return text.replace(/？/g, '?').replace(/！/g, '!').replace(/，/g, ',')
               .replace(/。/g, '.').replace(/’/g, "'").replace(/\s+/g, ' ').trim();
}

function readEnglish(text, btnEl) {
    const clean = cleanSentence(text);
    stopAllAudio();
    btnEl.classList.add('loading');
    tryAudioSource(clean, btnEl, 0);
}

// 在线音源逐个尝试：某个能播就用它，播不了自动换下一个
function tryAudioSource(text, btnEl, idx) {
    if (idx >= TTS_URL_MAKERS.length) {
        speakByPhone(text, btnEl); // 在线音源全挂了 → 用手机自带语音合成
        return;
    }
    const audio = new Audio();
    audio.preload = 'auto';
    let done = false;
    const fail = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        tryAudioSource(text, btnEl, idx + 1);
    };
    // 6秒还没播出来，就视为这个音源不可用，换下一个
    const timer = setTimeout(fail, 6000);
    audio.onerror = fail;
    audio.onended = () => { clearTimeout(timer); btnEl.classList.remove('loading'); };
    audio.src = TTS_URL_MAKERS[idx](text);
    audio.play().then(() => {
        if (done) { audio.pause(); return; }
        done = true; // 这个音源成功，开始播放
        clearTimeout(timer);
        currentAudio = audio;
    }).catch(fail);
}

// 最终兜底：手机自带的离线语音合成（不联网也能读）
function speakByPhone(text, btnEl) {
    const synth = window.speechSynthesis;
    if (!synth || !window.SpeechSynthesisUtterance) {
        btnEl.classList.remove('loading');
        showToast('😢 朗读加载失败，请检查网络后再试');
        return;
    }
    try {
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.85; // 稍微慢一点，方便跟读
        const voices = synth.getVoices() || [];
        const voice = voices.find(v => v.lang && v.lang.toLowerCase().indexOf('en-us') === 0)
                   || voices.find(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
        if (voice) u.voice = voice;
        u.onend = () => btnEl.classList.remove('loading');
        u.onerror = () => {
            btnEl.classList.remove('loading');
            showToast('😢 这台手机暂时读不了，换个浏览器试试～');
        };
        synth.speak(u);
        // 个别手机不触发onend，8秒后自动解除按钮的加载状态
        setTimeout(() => btnEl.classList.remove('loading'), 8000);
    } catch (e) {
        btnEl.classList.remove('loading');
        showToast('😢 这台手机暂时读不了，换个浏览器试试～');
    }
}

// 底部轻提示（替代alert，不再吓人）
function showToast(msg) {
    const t = document.getElementById('kittyToast');
    t.textContent = msg;
    t.style.opacity = 1;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.opacity = 0, 2500);
}

// Bingo音效（采用本地WebAudio生成，无网络依赖，手机微信完美兼容）
function playBingo() {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(1320, audioContext.currentTime + 0.12);
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.25, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.35);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.35);
    } catch (e) {
        console.log('音效播放异常', e);
    }
}

// 渲染卡片，全部显示喇叭按钮
function renderCards() {
    cardContainer.innerHTML = '';
    cardDomList = [];
    dailySentences.forEach((item, idx)=>{
        const div = document.createElement('div');
        div.className = `kitty-card bg-white rounded-3xl p-5 shadow-lg shadow-pink-200 border-2 border-kittyPink ${idx>0 ? 'hidden' : ''}`;
        div.innerHTML = `
            <div class="flex items-center justify-between gap-3">
                <div class="flex-1">
                    <div class="text-kittyDeepPink font-bold text-xl sentence-en">${item.en}</div>
                    <div class="text-gray-600 mt-1">${item.zh}</div>
                </div>
                <div class="speak-btn" title="点击朗读句子">🔊</div>
            </div>
        `;
        cardContainer.appendChild(div);
        cardDomList.push(div);
        const speakBtn = div.querySelector('.speak-btn');
        speakBtn.addEventListener('click', () => {
            readEnglish(item.en, speakBtn);
        });
    })
    progressText.textContent = `1 / ${dailySentences.length}`;
}

// 飘爱心特效
function showHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'heart-float';
    heart.innerText = '💖';
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1200);
}

// 获取随机鼓励语句
function getRandomEncourage(){
    const idx = Math.floor(Math.random() * encourageList.length);
    return encourageList[idx];
}

// 下一句按钮点击逻辑
nextBtn.addEventListener('click', function(e) {
    playBingo(); // 点击立刻播放bingo提示音
    showHeart(e.clientX, e.clientY);
    stopAllAudio(); // 切换句子时停掉上一句的朗读
    const total = dailySentences.length;
    if (currentStep < total) {
        cardDomList[currentStep].classList.remove('hidden');
        cardDomList[currentStep].classList.add('bounce-in');
        currentStep += 1;
        progressText.textContent = `${currentStep} / ${total}`;
        setTimeout(()=>{
            cardDomList[currentStep-1].scrollIntoView({behavior:"smooth", block:"center"});
        },120);
        if(currentStep === total){
            nextBtn.textContent = '完成学习 🎀';
        }
    } else {
        randomEncourageText.innerText = getRandomEncourage();
        finishModal.classList.remove('hidden');
        finishModal.classList.add('flex');
        playBingo(); // 弹出完成弹窗再次播放bingo
    }
})

// 重新开始按钮
restartBtn.addEventListener('click', function() {
    playBingo(); // 重置页面时播放bingo
    stopAllAudio();
    finishModal.classList.add('hidden');
    finishModal.classList.remove('flex');
    currentStep = 1;
    renderCards();
    nextBtn.textContent = '我学会啦，下一句 ✨';
})

window.onload = function(){
    renderCards();
}
</script>
</body>
</html>
